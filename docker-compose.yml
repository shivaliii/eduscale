version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: eduscale-db
    environment:
      POSTGRES_USER: eduscale
      POSTGRES_PASSWORD: eduscale_pass
      POSTGRES_DB: eduscale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduscale"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eduscale-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://eduscale:eduscale_pass@db:5432/eduscale
      SECRET_KEY: dev-secret-key-change-in-production
      DEMO_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduscale-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
